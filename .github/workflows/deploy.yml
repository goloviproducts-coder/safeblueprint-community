name: deploy
# main only changes through PRs that pass the required checks.
# - push to main (or manual run): deploy-staging only (no approval, https://staging.safeblueprint.pages.dev, noindex).
# - push of a signed v* tag (see docs/RELEASING.md): deploy-staging, then deploy-production, which
#   verifies the tag and waits for maintainer approval in the production environment before it gets the secrets.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    # Own group so a production deploy waiting for approval never blocks staging.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.safeblueprint.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check secrets are set
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy secrets missing::Add these secrets to the repository or 'staging' environment secrets:$missing"
            exit 1
          fi
      - name: Verify SHA256SUMS
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build hosted edition
        run: node scripts/build-edition.js hosted dist/hosted
      - name: Mark staging as noindex
        run: |
          # Add noindex inside every existing rule: a second /* block would replace the security headers.
          sed -i '/^  X-Frame-Options: DENY$/a\  X-Robots-Tag: noindex, nofollow' dist/hosted/_headers
          [ "$(grep -c '^  X-Robots-Tag: noindex' dist/hosted/_headers)" = "$(grep -c '^  X-Frame-Options: DENY' dist/hosted/_headers)" ]
          grep -q '^  Content-Security-Policy:' dist/hosted/_headers
          grep -q 'X-Robots-Tag: noindex' dist/hosted/_headers
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: pages deploy dist/hosted --project-name safeblueprint --branch staging --commit-dirty=true
      - name: Smoke test staging
        run: |
          set -u
          base=https://staging.safeblueprint.pages.dev
          fail=0
          sleep 15
          for p in / /about/ /security/ /schema/report/v1.json /ai-security-checklist/ /questions/default.csv; do
            code=$(curl -s -o page.tmp -w '%{http_code}' "$base$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || { echo "::error::$p returned $code"; fail=1; }
            if grep -iE 'gmail|golovi' page.tmp | grep -viq 'goloviproducts-coder'; then echo "::error::$p mentions gmail or golovi"; fail=1; fi
            if grep -qE '21,840' page.tmp; then echo "::error::$p shows a penalty amount"; fail=1; fi
          done
          curl -sI "$base/" | grep -qi '^x-robots-tag:.*noindex' || { echo "::error::noindex header missing"; fail=1; }
          curl -sI "$base/" | grep -qi '^content-security-policy:' || { echo "::error::CSP header missing"; fail=1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d '{}' "$base/api/contact")
          echo "/api/contact from foreign origin -> $code"
          [ "$code" = "403" ] || { echo "::error::contact function should refuse foreign origins (got $code)"; fail=1; }
          exit $fail
  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://safeblueprint.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag is signed, annotated and on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1; }
          read -r type sha < <(gh api "repos/$REPO/git/ref/tags/$TAG" -q '.object.type + " " + .object.sha')
          [ "$type" = "tag" ] || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          [ "$(gh api "repos/$REPO/git/tags/$sha" -q .verification.verified)" = "true" ] || { echo "::error::$TAG signature is not verified by GitHub"; exit 1; }
          commit=$(gh api "repos/$REPO/git/tags/$sha" -q .object.sha)
          status=$(gh api "repos/$REPO/compare/$commit...main" -q .status)
          case "$status" in ahead|identical) ;; *) echo "::error::$TAG ($commit) is not on main ($status)"; exit 1;; esac
          echo "TAG_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "$TAG -> $commit: signed, annotated, on main"
      - name: Release files are prepared for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release.js "$TAG"
      - name: Build, deploy and smoke-test production
        uses: $/.github/actions/deploy-production
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
