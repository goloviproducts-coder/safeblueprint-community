name: deploy
# main only changes through PRs that pass the required checks, so a push to main is safe to deploy.
# The production environment requires approval by a maintainer before this job gets the secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://safeblueprint.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check secrets are set
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy secrets missing::Add these secrets to the 'production' environment (Settings > Environments > production):$missing"
            exit 1
          fi
      - name: Verify SHA256SUMS
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build hosted edition
        run: node scripts/build-edition.js hosted dist/hosted
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: pages deploy dist/hosted --project-name safeblueprint --branch main --commit-dirty=true
      - name: Smoke test production
        run: |
          set -u
          base=https://safeblueprint.pages.dev
          fail=0
          sleep 15
          for p in / /about/ /security/ /schema/report/v1.json /ai-security-checklist/ /questions/default.csv; do
            code=$(curl -s -o page.tmp -w '%{http_code}' "$base$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || { echo "::error::$p returned $code"; fail=1; }
            if grep -iE 'gmail|golovi' page.tmp | grep -viq 'goloviproducts-coder'; then echo "::error::$p mentions gmail or golovi"; fail=1; fi
            if grep -qE '21,840' page.tmp; then echo "::error::$p shows a penalty amount"; fail=1; fi
          done
          curl -sI "$base/" | grep -qi '^content-security-policy:' || { echo "::error::CSP header missing"; fail=1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d '{}' "$base/api/contact")
          echo "/api/contact from foreign origin -> $code"
          [ "$code" = "403" ] || { echo "::error::contact function should refuse foreign origins (got $code)"; fail=1; }
          exit $fail
