name: trivy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trivy CLI image used directly instead of trivy-action.
      - name: Config scan (Dockerfile, compose, nginx)
        run: docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.76.1 config --exit-code 1 --severity HIGH,CRITICAL --format sarif --output trivy-config.sarif .
      - name: Filesystem scan (vulns, secrets, misconfig)
        if: always()
        run: docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.76.1 fs --scanners vuln,secret,misconfig --exit-code 1 --severity HIGH,CRITICAL --format sarif --output trivy-fs.sarif .
      - if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
