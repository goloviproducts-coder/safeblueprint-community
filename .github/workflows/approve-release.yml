name: approve-release
# Approve to release: one maintainer approval in the production environment tags main, deploys
# production and publishes the release, so nobody has to tag by hand. See docs/RELEASING.md.
# 1. check (read-only): main only; CHANGELOG/VERSION/package.json prepared for the version; the tag is
#    free; main HEAD is a GitHub-verified commit. Records that SHA.
# 2. release-production (production environment = the approval): SSH-signs an annotated tag at the
#    recorded SHA with the RELEASE_DEPLOY_KEY environment secret, verifies it against
#    .github/release-signers and pushes it over SSH (pinned github.com host key; the v* ruleset lets
#    Deploy keys bypass), then deploys that commit to production with the same steps as deploy.yml.
# 3. publish: calls release.yml to build, attest and publish the release, noting the approver and run.
# The SSH push does trigger the push-based release/deploy workflows; their first job sees the
# release identity as tagger and skips, so nothing deploys twice. Signed manual tags work as before.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v1.0.2 (must match VERSION and CHANGELOG on main)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: approve-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Run from main only
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = "refs/heads/main" ] || { echo "::error::Run approve-release from main"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check main is ready to release this version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION_INPUT#v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION_INPUT' is not a vX.Y.Z version"; exit 1; }
          sha=$(git rev-parse HEAD)
          node scripts/check-release.js "$tag"
          grep -qE '^release@safeblueprint\.invalid +namespaces="git" +ssh-' .github/release-signers || { echo "::error::.github/release-signers has no release key yet (docs/RELEASING.md, one-time setup)"; exit 1; }
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then echo "::error::$tag already exists"; exit 1; fi
          [ "$(gh api "repos/$REPO/commits/$sha" -q .commit.verification.verified)" = "true" ] || { echo "::error::main HEAD $sha is not a verified commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Ready: $tag at $sha. Waiting for production approval." >> "$GITHUB_STEP_SUMMARY"
  release-production:
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://safeblueprint.pages.dev
    permissions:
      contents: read
      actions: read # read who approved this run
      deployments: write # record the production deployment
    outputs:
      approver: ${{ steps.approval.outputs.approver }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Confirm the approval and that the recorded commit is still on main
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          approver=$(gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" -q '[.[] | select(.state == "approved") | .user.login] | last // ""')
          [ -n "$approver" ] || { echo "::error::No production approval recorded for this run"; exit 1; }
          status=$(gh api "repos/$REPO/compare/$SHA...main" -q .status)
          case "$status" in ahead|identical) ;; *) echo "::error::$SHA is no longer on main ($status)"; exit 1;; esac
          echo "approver=$approver" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}
      - name: Release files are prepared for this tag
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: node scripts/check-release.js "$TAG"
      - name: Sign and push the tag with the release deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          APPROVER: ${{ steps.approval.outputs.approver }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/create-release-tag.sh "$TAG" "$SHA" "$APPROVER" "$RUN_URL"
          echo "Tagged $TAG at $SHA (SSH-signed release key), approved by @$APPROVER" >> "$GITHUB_STEP_SUMMARY"
      - name: Build, deploy and smoke-test production
        uses: ./.github/actions/deploy-production # zizmor: ignore[self-repository] local action from the checked-out release commit
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  publish:
    needs: [check, release-production]
    permissions:
      contents: write # publish the GitHub release and upload its files
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestations
    uses: $/.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
      sha: ${{ needs.check.outputs.sha }}
      approver: ${{ needs.release-production.outputs.approver }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
