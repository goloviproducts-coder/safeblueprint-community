name: checksums
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify SHA256SUMS
        run: sha256sum -c SHA256SUMS.txt
      - name: No outbound network calls
        run: |
          # Reference links are fine; flag code that loads or calls an absolute host.
          pat_js='(fetch|importScripts|sendBeacon|EventSource|WebSocket|XMLHttpRequest|import)\s*\(?\s*["'"'"'`](https?:|wss?:)?//'
          pat_html='<(script|link|img|iframe)[^>]+(src|href)=["'"'"'](https?:)?//'
          if grep -rEn "$pat_js" site --include=*.js; then echo "Outbound call in JS"; exit 1; fi
          if grep -rEn "$pat_html" site --include=*.html | grep -Ev 'rel="?(canonical|noopener)'; then echo "External resource in HTML"; exit 1; fi
          echo "No outbound calls found"
