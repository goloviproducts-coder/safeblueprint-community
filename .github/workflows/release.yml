name: release
# Two entry points:
# - push of a maintainer-signed v* tag: verifies the tag is annotated, GitHub-verified and on main.
# - workflow_call from approve-release.yml after the production approval: the tag is SSH-signed by the
#   release deploy key, so it checks the signature against the committed .github/release-signers
#   (GitHub cannot show it as Verified), the release identity, the approved commit, and that it is on main.
#   The push this tag causes is skipped by the source job.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      sha:
        description: Commit checked before approval; the tag must point at it
        type: string
        required: true
      approver:
        type: string
        required: true
      run_url:
        type: string
        required: true
permissions:
  contents: read
jobs:
  source:
    # A v* tag pushed by the approve-release workflow is released and deployed inside that run, so the
    # push it causes here is skipped (no duplicate release or deploy, no second approval).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.source.outputs.skip }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Is this tag from the approve-release workflow
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            read -r type sha < <(gh api "repos/$REPO/git/ref/${REF#refs/}" -q '.object.type + " " + .object.sha')
            if [ "$type" = "tag" ] && [ "$(gh api "repos/$REPO/git/tags/$sha" -q '.tagger.name + " " + .tagger.email')" = "safeblueprint-release release@safeblueprint.invalid" ]; then
              skip=true
              echo "Tag from approve-release: release and deploy run in that workflow; skipping here." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  release:
    needs: source
    if: needs.source.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SYFT_VERSION: "1.55.0"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.ref }}
      - name: Verify tag is signed, annotated and on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          APPROVED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1; }
          read -r type sha < <(gh api "repos/$REPO/git/ref/tags/$TAG" -q '.object.type + " " + .object.sha')
          [ "$type" = "tag" ] || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          commit=$(gh api "repos/$REPO/git/tags/$sha" -q .object.sha)
          if [ -n "$APPROVED_SHA" ]; then
            [ "$commit" = "$APPROVED_SHA" ] || { echo "::error::$TAG points at $commit, not the approved commit $APPROVED_SHA"; exit 1; }
            git fetch -q --no-tags "https://github.com/$REPO.git" "refs/tags/$TAG:refs/tags/$TAG"
            scripts/verify-release-tag.sh "$TAG" "$APPROVED_SHA" >/dev/null
          else
            [ "$(gh api "repos/$REPO/git/tags/$sha" -q .verification.verified)" = "true" ] || { echo "::error::$TAG signature is not verified by GitHub"; exit 1; }
          fi
          status=$(gh api "repos/$REPO/compare/$commit...main" -q .status)
          case "$status" in ahead|identical) ;; *) echo "::error::$TAG ($commit) is not on main ($status)"; exit 1;; esac
          echo "TAG_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "$TAG -> $commit: signed, annotated, on main"
      - name: Release files are prepared for this tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release.js "$TAG"
      - name: Verify source checksums
        run: sha256sum -c SHA256SUMS.txt
      - name: Build zip (reproducible, built twice)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VER="${TAG#v}"
          scripts/build-release.sh "$VER" dist
          scripts/build-release.sh "$VER" /tmp/rebuild
          NAME="safeblueprint-selfhost-${VER}"
          cmp "dist/${NAME}.zip" "/tmp/rebuild/${NAME}.zip" || { echo "Release zip is not reproducible" >&2; exit 1; }
          mkdir -p "dist/${NAME}" && (cd dist && unzip -q "${NAME}.zip")
          echo "NAME=${NAME}" >> "$GITHUB_ENV"
      - name: Install syft (checksum verified)
        run: |
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          f="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/${f}" -O "${base}/syft_${SYFT_VERSION}_checksums.txt"
          grep " ${f}\$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${f}" syft
      - name: SBOMs
        run: |
          ./syft scan "dir:dist/${NAME}" -o "spdx-json=dist/${NAME}.spdx.json" -o "cyclonedx-json=dist/${NAME}.cdx.json"
          (cd dist && sha256sum "${NAME}.zip" "${NAME}.spdx.json" "${NAME}.cdx.json" > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.NAME }}.zip
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/${{ env.NAME }}.zip
          sbom-path: dist/${{ env.NAME }}.spdx.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          APPROVER: ${{ inputs.approver }}
          RUN_URL: ${{ inputs.run_url }}
        run: |
          node scripts/release-notes.js "$TAG" "$NAME" "$GITHUB_REPOSITORY" "$APPROVER" "$RUN_URL" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "SafeBlueprint $TAG" --verify-tag \
            --notes-file notes.md \
            "dist/${NAME}.zip" "dist/${NAME}.spdx.json" "dist/${NAME}.cdx.json" dist/SHA256SUMS
