name: preview
# Deploys same-repo pull requests to a Cloudflare Pages preview (https://pr-<number>.safeblueprint.pages.dev)
# with a noindex header, and comments the URL on the PR. Fork PRs never run this job and never get secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.safeblueprint.pages.dev
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check secrets are set
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] || { echo "::error::Cloudflare secrets are not available to the preview environment"; exit 1; }
      - name: Verify SHA256SUMS
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build hosted edition
        run: node scripts/build-edition.js hosted dist/hosted
      - name: Mark preview as noindex
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/hosted/_headers
          grep -q 'X-Robots-Tag: noindex' dist/hosted/_headers
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: pages deploy dist/hosted --project-name safeblueprint --branch pr-${{ github.event.pull_request.number }} --commit-dirty=true
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          url="https://pr-${PR}.safeblueprint.pages.dev"
          body="<!-- safeblueprint-preview -->
          Preview for ${SHA:0:7}: $url (not indexed by search engines; contact form may be unavailable)"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q '.[] | select(.user.login=="github-actions[bot]" and (.body|startswith("<!-- safeblueprint-preview -->"))) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null; fi
          echo "Preview: $url"
