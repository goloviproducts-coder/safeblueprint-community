name: threat-model-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  threat-model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Was the review label applied by a maintainer?
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          actor=$(gh api "repos/$REPO/issues/$PR/events" --paginate -q '[.[] | select((.event=="labeled" or .event=="unlabeled") and .label.name=="threat-model-reviewed")] | last | select(.event=="labeled") | .actor.login')
          ok=false
          if [ -n "$actor" ]; then
            perm=$(gh api "repos/$REPO/collaborators/$actor/permission" -q .permission 2>/dev/null || echo none)
            case "$perm" in admin|maintain) ok=true ;; esac
            echo "Label applied by $actor ($perm)"
          fi
          echo "reviewed=$ok" >> "$GITHUB_OUTPUT"
      - name: Threat model gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWED_LABEL: ${{ steps.label.outputs.reviewed }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
          node scripts/threat-model-gate.js changed.txt
