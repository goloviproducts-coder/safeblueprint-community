name: threat-model-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  # A new push invalidates an earlier review: drop the label so a maintainer must re-apply it.
  reset-review-label:
    if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'threat-model-reviewed') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Remove threat-model-reviewed label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/threat-model-reviewed" || true
  threat-model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gate script and its rules come from the base branch, so a PR cannot weaken them.
      - name: Check out base branch gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          sparse-checkout: |
            scripts/threat-model-gate.js
            scripts/threat-model-generate.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Was the review label applied by a maintainer after the latest push?
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ev=$(gh api "repos/$REPO/issues/$PR/events" --paginate -q '[.[] | select((.event=="labeled" or .event=="unlabeled") and .label.name=="threat-model-reviewed")] | last | select(.event=="labeled") | "\(.actor.login) \(.created_at)"')
          # When the head commit reached GitHub: first check suite on that SHA (not the forgeable commit date).
          pushed_at=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-suites" -q '[.check_suites[].created_at] | min' 2>/dev/null || true)
          ok=false
          if [ -n "$ev" ]; then
            actor=${ev%% *}; at=${ev##* }
            perm=$(gh api "repos/$REPO/collaborators/$actor/permission" -q .permission 2>/dev/null || echo none)
            ref=$pushed_at
            echo "Label by $actor ($perm) at $at; head pushed at $ref"
            case "$perm" in admin|maintain)
              if [ -n "$ref" ] && [[ "$at" > "$ref" ]]; then ok=true; else echo "Label predates the latest push (or push time unknown); re-apply it after reviewing."; fi ;;
            esac
          fi
          echo "reviewed=$ok" >> "$GITHUB_OUTPUT"
      - name: Threat model gate (base branch script)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWED_LABEL: ${{ steps.label.outputs.reviewed }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          # Content before the PR is read from the merge base, so the classifier compares real changes.
          BASE_REF=$(git merge-base "$BASE_SHA" "$HEAD_SHA") node .base/scripts/threat-model-gate.js "$RUNNER_TEMP/changed.txt"
  # The machine-readable inventory must match the code. Read-only: nothing is pushed back to the
  # branch; if it is stale the job fails and the author (or the bot) runs `npm run threat-model`.
  inventory-up-to-date:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Regenerate and compare docs/threat-model/inventory.json
        run: |
          node scripts/threat-model-generate.js
          if ! git diff --exit-code -- docs/threat-model/inventory.json; then
            echo "::error file=docs/threat-model/inventory.json::Inventory is out of date. Run 'npm run threat-model' and commit the result."
            exit 1
          fi
