name: site-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx --yes html-validate@9.7.1 "site/**/*.html"
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Lighthouse (report only)
        run: |
          npx --yes serve@14.2.6 site -l 3000 &
          sleep 5
          npx --yes @lhci/cli@0.15.1 collect --url=http://localhost:3000/ --url=http://localhost:3000/ai-security-checklist/ --numberOfRuns=1
          npx --yes @lhci/cli@0.15.1 upload --target=filesystem --outputDir=lhci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lhci
