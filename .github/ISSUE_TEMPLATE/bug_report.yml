name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes: { value: "Do not include real personal or confidential data. Security issues: use private reporting (see SECURITY.md)." }
  - type: input
    id: version
    attributes: { label: Version (from VERSION file) }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
  - type: input
    id: env
    attributes: { label: Browser and OS }
