worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp; proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp; uwsgi_temp_path /tmp/uwsgi_temp; scgi_temp_path /tmp/scgi_temp;
  access_log /dev/stdout; error_log /dev/stderr warn;
  server_tokens off; sendfile on;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' blob:; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; worker-src 'self'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Enable when served over HTTPS (e.g. behind your TLS proxy):
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    location = /sw.js { add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' blob:; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; worker-src 'self'; manifest-src 'self'" always; add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always; add_header Cross-Origin-Resource-Policy "same-origin" always; }
    location ~ /(_headers|SHA256SUMS\.txt)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
  }
}
